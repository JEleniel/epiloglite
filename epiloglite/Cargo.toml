[package]
name = "epiloglite"
version.workspace = true
edition.workspace = true
description = "EpilogLite is a pure Rust implementation of SQLite, designed for safety, reliability, and performance. It provides a drop-in compatible alternative to SQLite with modern Rust idioms."
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["lib"]
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
bincode.workspace = true
chrono.workspace = true
crc-adler.workspace = true
epiloglite-core.workspace = true
epiloglite-derive.workspace = true
flagset.workspace = true
log.workspace = true
logos.workspace = true
num-traits.workspace = true
once_cell = "1.21.3"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[features]
default = []
# Enable the "C" ABI compatibility layer (requires std)
cabi = []

[lints]
workspace = true
