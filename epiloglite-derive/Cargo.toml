[package]
name = "epiloglite-derive"
version = "0.1.0"
edition = "2021"
description = "Procedural macros for EpilogLite ORM support."
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
epiloglite-core = { path = "../epiloglite-core" }
once_cell = { version = "1.9.0" }
proc-macro2 = { version = "1.0.103" }
quote = { version = "1.0.41" }
serde.workspace = true
serde_json.workspace = true
syn = { version = "2", features = ["full"] }
thiserror = { version = "2.0.17" }

[dev-dependencies]
flagset = "0.4"
trybuild = "1"
